AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 bucket that a JellyWing server publishes its cloud twin to.

Resources:
  StoreBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'jellywing-twin-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Sign-in attempt counters are only good for minutes.
          - Id: ExpireSignInLimits
            Status: Enabled
            Prefix: state/limits/
            ExpirationInDays: 1
          - Id: AbortStalledUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  StoreBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StoreBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt StoreBucket.Arn
              - !Sub '${StoreBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  BucketName:
    Description: Value for twin:s3:bucket.
    Value: !Ref StoreBucket
  Endpoint:
    Description: Value for twin:s3:endpoint.
    Value: !Sub 'https://s3.${AWS::Region}.amazonaws.com'
  Region:
    Description: Value for twin:s3:region.
    Value: !Ref AWS::Region
